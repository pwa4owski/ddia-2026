services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "--output-document=/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12
    stop_grace_period: 30s
