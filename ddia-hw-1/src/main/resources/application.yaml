spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

metrics:
  name: bookings.request

management:
  metrics:
    distribution:
      percentiles-histogram:
        bookings.request: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,mappings
